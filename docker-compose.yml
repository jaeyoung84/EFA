name: investment-analysis

# 로컬 PC 실행용 구성입니다.
# 운영 서버는 docker-compose.prod.yml을 사용합니다.
services:
  backend:
    image: jaeyoungsong/jy-investing:latest
    build:
      context: .
      dockerfile: Dockerfile.service
    container_name: investment_backend
    restart: unless-stopped
    # 일부 WSL2 환경은 Docker FORWARD 규칙이 컨테이너 간 통신과 외부 시세
    # 요청을 함께 차단한다. 로컬 백엔드만 host 네트워크를 사용해 이를 피한다.
    network_mode: host
    command: ["sh", "-c", "uvicorn app.backend.main:app --host 0.0.0.0 --port ${APP_PORT:-8000}"]
    environment:
      APP_PORT: ${APP_PORT:-8000}
      MONGODB_URL: mongodb://127.0.0.1:${MONGO_PORT:-27017}
      MONGODB_DB: ${MONGODB_DB:-investment_db}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-}
      LEGACY_EMAIL_SIGNUP_ENABLED: ${LEGACY_EMAIL_SIGNUP_ENABLED:-false}
      DART_API_KEY: ${DART_API_KEY:-}
      KRX_COMPANY_LIST_URL: ${KRX_COMPANY_LIST_URL:-}
      KRX_COMPANY_LIST_TIMEOUT_SECONDS: ${KRX_COMPANY_LIST_TIMEOUT_SECONDS:-4}
      MARKET_DATA_PROVIDERS: ${MARKET_DATA_PROVIDERS:-yahoo,stooq,fred}
      MARKET_DATA_REVIEW_REJECTION_PCT: ${MARKET_DATA_REVIEW_REJECTION_PCT:-1}
      FRED_SERIES_MAP: ${FRED_SERIES_MAP:-KRW=X=DEXKOUS}
      FX_CROSSCHECK_MAX_DEVIATION_PCT: ${FX_CROSSCHECK_MAX_DEVIATION_PCT:-3}
      MARKET_DATA_PROVIDER_MIN_ATTEMPTS: ${MARKET_DATA_PROVIDER_MIN_ATTEMPTS:-3}
      MARKET_DATA_PROVIDER_MAX_ERROR_RATE_PCT: ${MARKET_DATA_PROVIDER_MAX_ERROR_RATE_PCT:-20}
      MARKET_DATA_PROVIDER_MAX_REJECTION_RATE_PCT: ${MARKET_DATA_PROVIDER_MAX_REJECTION_RATE_PCT:-5}
      MARKET_DATA_PROVIDER_SLOW_LATENCY_MS: ${MARKET_DATA_PROVIDER_SLOW_LATENCY_MS:-5000}
      MARKET_DATA_PROVIDER_LATENCY_BASELINE_DAYS: ${MARKET_DATA_PROVIDER_LATENCY_BASELINE_DAYS:-7}
      MARKET_DATA_PROVIDER_LATENCY_MIN_BASELINE_SNAPSHOTS: ${MARKET_DATA_PROVIDER_LATENCY_MIN_BASELINE_SNAPSHOTS:-3}
      MARKET_DATA_PROVIDER_LATENCY_REGRESSION_PCT: ${MARKET_DATA_PROVIDER_LATENCY_REGRESSION_PCT:-75}
      MARKET_DATA_PROVIDER_BACKOFF_BASE_MINUTES: ${MARKET_DATA_PROVIDER_BACKOFF_BASE_MINUTES:-5}
      MARKET_DATA_PROVIDER_BACKOFF_MAX_MINUTES: ${MARKET_DATA_PROVIDER_BACKOFF_MAX_MINUTES:-120}
      MARKET_DATA_DAILY_REFRESH_ENABLED: ${MARKET_DATA_DAILY_REFRESH_ENABLED:-true}
      MARKET_DATA_DAILY_REFRESH_HOUR_KST: ${MARKET_DATA_DAILY_REFRESH_HOUR_KST:-18}
      MARKET_DATA_DAILY_REFRESH_MINUTE_KST: ${MARKET_DATA_DAILY_REFRESH_MINUTE_KST:-25}
      MARKET_DATA_REFRESH_DAYS: ${MARKET_DATA_REFRESH_DAYS:-370}
      MARKET_DATA_CORE_TICKERS: ${MARKET_DATA_CORE_TICKERS:-^KS11,^KQ11,^GSPC,^IXIC,KRW=X}
      KQS_RECOMMENDATION_SOURCE: ${KQS_RECOMMENDATION_SOURCE:-snapshot}
      KQS_SNAPSHOT_DB: /app/state/kqs/recommendations.sqlite3
      KQS_BRIDGE_URL: ${KQS_BRIDGE_URL:-http://127.0.0.1:18100}
      KQS_REVIEW_SLA_HOURS: ${KQS_REVIEW_SLA_HOURS:-4}
      KQS_REVIEW_DUE_SOON_MINUTES: ${KQS_REVIEW_DUE_SOON_MINUTES:-60}
      KQS_OPERATIONS_ACK_SLA_HOURS: ${KQS_OPERATIONS_ACK_SLA_HOURS:-8}
      KQS_OUTCOME_MIN_SAMPLE_SIZE: ${KQS_OUTCOME_MIN_SAMPLE_SIZE:-20}
      RESEARCH_REVALIDATION_MAX_AGE_DAYS: ${RESEARCH_REVALIDATION_MAX_AGE_DAYS:-31}
      KOSIS_API_KEY: ${KOSIS_API_KEY:-}
      BOK_API_KEY: ${BOK_API_KEY:-}
      EXECUTION_MODE: ${EXECUTION_MODE:-paper}
      EXECUTION_GLOBAL_KILL_SWITCH: ${EXECUTION_GLOBAL_KILL_SWITCH:-false}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      LIVE_TRADING_KILL_SWITCH: ${LIVE_TRADING_KILL_SWITCH:-true}
      BROKER_ADAPTER: ${BROKER_ADAPTER:-}
      BROKER_SANDBOX_ENABLED: ${BROKER_SANDBOX_ENABLED:-false}
      BROKER_SECRET_SOURCE: ${BROKER_SECRET_SOURCE:-none}
      BROKER_API_KEY_REF: ${BROKER_API_KEY_REF:-}
      BROKER_API_SECRET_REF: ${BROKER_API_SECRET_REF:-}
      BROKER_ACCOUNT_ID_REF: ${BROKER_ACCOUNT_ID_REF:-}
      EXECUTION_OPERATOR_EMAILS: ${EXECUTION_OPERATOR_EMAILS:-}
      STRATEGY_PROMOTION_REVIEW_DAYS: ${STRATEGY_PROMOTION_REVIEW_DAYS:-30}
      STRATEGY_PROMOTION_PERFORMANCE_GAP_PCT: ${STRATEGY_PROMOTION_PERFORMANCE_GAP_PCT:-10}
      PAPER_ORDER_REQUIRE_PROMOTION_APPROVAL: ${PAPER_ORDER_REQUIRE_PROMOTION_APPROVAL:-false}
      PAPER_ORDER_BLOCK_PROMOTION_ALERTS: ${PAPER_ORDER_BLOCK_PROMOTION_ALERTS:-true}
      PAPER_LIVE_REVIEW_MIN_TRADING_DAYS: ${PAPER_LIVE_REVIEW_MIN_TRADING_DAYS:-20}
      PAPER_LIVE_REVIEW_MIN_ORDER_DECISIONS: ${PAPER_LIVE_REVIEW_MIN_ORDER_DECISIONS:-3}
      PAPER_LIVE_REVIEW_MAX_MDD_PCT: ${PAPER_LIVE_REVIEW_MAX_MDD_PCT:-10}
      PAPER_LIVE_REVIEW_MAX_PERFORMANCE_GAP_PCT: ${PAPER_LIVE_REVIEW_MAX_PERFORMANCE_GAP_PCT:-10}
      PAPER_LIVE_REVIEW_MAX_BLOCK_RATE_PCT: ${PAPER_LIVE_REVIEW_MAX_BLOCK_RATE_PCT:-20}
      PAPER_LIVE_REVIEW_MAX_REDUCED_RATE_PCT: ${PAPER_LIVE_REVIEW_MAX_REDUCED_RATE_PCT:-20}
      PAPER_LIVE_REVIEW_MAX_SANDBOX_REJECTION_RATE_PCT: ${PAPER_LIVE_REVIEW_MAX_SANDBOX_REJECTION_RATE_PCT:-10}
      BROKER_API_KEY: ${BROKER_API_KEY:-}
      BROKER_API_SECRET: ${BROKER_API_SECRET:-}
      BROKER_ACCOUNT_ID: ${BROKER_ACCOUNT_ID:-}
    volumes:
      - ./docs:/app/docs:ro
      # 백업 파일은 실행 컨테이너에 쓰지 않고, 복구 준비 상태 점검용으로만 읽는다.
      - ./backups:/app/backups:ro
      # Only the separate worker publishes; the website cannot modify snapshots.
      - ./state/kqs:/app/state/kqs:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:${APP_PORT:-8000}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: investment_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-investment_db}
    volumes:
      - investment_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  investment_mongo_data:
