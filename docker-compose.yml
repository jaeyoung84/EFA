name: jy-investing

# GitHub Codespaces 및 로컬 환경용 초경량 Docker Compose 구성입니다.
# Ollama LLM, Qdrant 벡터DB, Meilisearch 검색엔진 등 무거운 의존성을 정리하고,
# MongoDB 7.0과 30/30 만점 시험 결과가 내장된 All-in-One 이미지를 사용합니다.
#
# 실행: docker compose up -d
# 접속: http://localhost:8000 (Codespaces 환경에서는 포트 8000 Forwarding URL)
# 종료: docker compose down
#
# (무거운 전체 RAG 환경이 필요한 경우: docker compose -f docker-compose.full-rag.yml up -d)

services:
  app:
    image: jaeyoungsong/jy-investing:latest
    container_name: jy_investing_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_DB: jy_investing
      RAG_EMBEDDING_PROVIDER: hash
      RAG_LLM_API_KEY: ""
      RAG_LLM_MODEL: ""
    volumes:
      - jy_investing_data:/data/db
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  jy_investing_data:
