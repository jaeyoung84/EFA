services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/edumgt/investment-analysis-backend:latest}
    container_name: investment_backend
    restart: unless-stopped
    ports:
      - "8801:8000"
    env_file:
      - app/backend/.env
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=investment_db
      - KQS_RECOMMENDATION_SOURCE=${KQS_RECOMMENDATION_SOURCE:-snapshot}
      - KQS_SNAPSHOT_DB=/app/state/kqs/recommendations.sqlite3
    volumes:
      - type: bind
        source: ${KQS_STATE_DIR:-/opt/investing-app/state/kqs}
        target: /app/state/kqs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - mongo
    networks:
      - investment-net

  mongo:
    image: mongo:7
    container_name: investment_mongo
    restart: unless-stopped
    volumes:
      - investment_mongo_data:/data/db
    networks:
      - investment-net

networks:
  investment-net:
    driver: bridge

volumes:
  investment_mongo_data:
