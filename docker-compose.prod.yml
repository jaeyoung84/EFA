services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/edumgt/investment-analysis-backend:latest}
    container_name: investment_backend
    restart: unless-stopped
    # 메모리가 비정상적으로 늘면 서버 전체가 멈추지 않고 이 컨테이너만 재시작되게 한다(2026-10-02 장애 대응).
    # 평소 사용량은 150~400MB이며, 서버 전체 메모리는 약 1.9GB다.
    mem_limit: 1g
    ports:
      # 서버 내부에서만 받는다. 외부 접속은 Cloudflare → nginx(443) → 127.0.0.1:8801.
      - "127.0.0.1:8801:8000"
    env_file:
      - app/backend/.env
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=investment_db
      - KQS_RECOMMENDATION_SOURCE=${KQS_RECOMMENDATION_SOURCE:-snapshot}
      - KQS_SNAPSHOT_DB=/app/state/kqs/recommendations.sqlite3
    volumes:
      - type: bind
        source: ${KQS_STATE_DIR:-/opt/investing-app/state/kqs}
        target: /app/state/kqs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - mongo
    networks:
      - investment-net

  mongo:
    image: mongo:7
    container_name: investment_mongo
    restart: unless-stopped
    volumes:
      - investment_mongo_data:/data/db
    networks:
      - investment-net

networks:
  investment-net:
    driver: bridge

volumes:
  investment_mongo_data:
