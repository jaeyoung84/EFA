# efa-quant.com — EC2 nginx 사이트 설정 원본 (/etc/nginx/sites-enabled/default 에 적용).
# Cloudflare(프록시) → 443(Cloudflare Origin 인증서) → 127.0.0.1:8801(backend). 80은 https로 이동만 한다.
# 실제 접속자 IP는 Cloudflare 대역에서 온 요청의 CF-Connecting-IP만 인정한다.
# 대역 출처: https://www.cloudflare.com/ips/ (2026-10-01 확인, 보안그룹 IPv4 규칙과 동일). 바뀌면 둘 다 갱신한다.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
server_tokens off;

# 요청 횟수 제한(실제 접속자 IP 기준, 넘으면 429). 정상 사용보다 넉넉하게 잡는다.
# - 로그인 시도: 분당 10회 / 한투 시세·위험 공시·포트폴리오 평가: 초당 3회(한투 호출 한도 보호) / 그 밖 API: 초당 20회
limit_req_zone $binary_remote_addr zone=efa_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=efa_kis:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=efa_api:10m rate=20r/s;
limit_req_status 429;
limit_req_log_level warn;

# 모르는 호스트 이름(서버 IP 직접 접속, 이 서버를 가리키게 한 남의 도메인)은 응답 없이 끊는다.
# 실제 사이트 이름(efa-quant.com, www)만 아래 server 블록이 받는다.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name efa-quant.com www.efa-quant.com;
    return 301 https://efa-quant.com$request_uri;
}

# www는 항상 기본 주소로 보낸다. 브라우저 로그인 정보(localStorage)와 네이버 로그인 확인 쿠키가 주소별로 따로라,
# www와 기본 주소가 섞이면 로그인 실패·로그인 상태 불일치가 생긴다.
server {
    listen 443 ssl;
    server_name www.efa-quant.com;
    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;
    return 301 https://efa-quant.com$request_uri;
}

server {
    listen 443 ssl;
    server_name efa-quant.com;
    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    # 아래 location들이 함께 쓰는 프록시 설정(location에서 다시 정하지 않으면 그대로 물려받는다).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;

    location ~ ^/api/auth/(login|signup|naver/) {
        limit_req zone=efa_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8801;
    }

    location ~ ^/api/(market/live-quotes|market/stock-risk|portfolio/valuation)$ {
        limit_req zone=efa_kis burst=30 nodelay;
        proxy_pass http://127.0.0.1:8801;
    }

    location /api/ {
        limit_req zone=efa_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:8801;
    }

    location / {
        proxy_pass http://127.0.0.1:8801;
    }
}
