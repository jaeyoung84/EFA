name: Build and Deploy

# main push -> KQS/leverage regression gate -> tested commit to private S3 -> SSM command on EC2.
# No SSH port, no long-lived AWS keys (GitHub OIDC), no registry token on the server.
on:
  push:
    branches: [main]
    paths-ignore:
      - "readme.md"
      - "image.png"
      - ".claude/**"
      - ".github/workflows/deploy-stock-trade.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: investment-analysis-main
  # Never cancel a running deployment: the SSM command keeps running on the host even if CI stops.
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/investing-app
  AWS_REGION: ap-northeast-2
  AWS_DEPLOY_ROLE: arn:aws:iam::125022369601:role/github-actions-investing-deploy
  DEPLOY_BUCKET: investing-app-deploy-125022369601
  INSTANCE_ID: i-0dc146c28dca4089b

jobs:
  kqs-checks:
    uses: ./.github/workflows/kqs-runtime.yml

  build:
    needs: kqs-checks
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload exactly the tested commit (tracked files only)
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/release.tar.gz" "$GITHUB_SHA"
          aws s3 cp "$RUNNER_TEMP/release.tar.gz" "s3://$DEPLOY_BUCKET/gha/$GITHUB_SHA/release.tar.gz" --no-progress

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Build on the host, preflight, swap only the backend, roll back if unhealthy (via SSM)
        # Server side: infra/ops/deploy-backend-release.sh from the same commit runs
        # kqs-deployment-preflight.sh (COMPOSE_PROJECT_NAME from the existing deployment),
        # records previous_image= and runs "docker compose up -d --no-deps backend".
        run: |
          release="/opt/investing-app-releases/$GITHUB_SHA"
          python3 - "$release" > "$RUNNER_TEMP/ssm.json" <<'PY'
          import json, os, sys
          release, sha, bucket = sys.argv[1], os.environ["GITHUB_SHA"], os.environ["DEPLOY_BUCKET"]
          commands = [
              "set -eu",
              f"mkdir -p {release}",
              f"aws s3 cp s3://{bucket}/gha/{sha}/release.tar.gz /tmp/release-{sha}.tar.gz --no-progress",
              f"tar xzf /tmp/release-{sha}.tar.gz -C {release}",
              f"rm -f /tmp/release-{sha}.tar.gz",
              f"bash {release}/infra/ops/deploy-backend-release.sh {sha} {release}",
          ]
          print(json.dumps({"commands": commands, "executionTimeout": ["3600"]}))
          PY
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::12}" --timeout-seconds 600 \
            --parameters "file://$RUNNER_TEMP/ssm.json" --query Command.CommandId --output text)
          echo "SSM command: $command_id"
          status=Pending
          for _ in $(seq 1 360); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          test "$status" = Success

