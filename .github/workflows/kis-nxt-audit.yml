name: KIS NXT audited five-day quotes only
# Codex 수정: CODX-NXT-001 (2026-10-17), fixed quote-only collection.
# 조회 전용: 운영 백엔드 컨테이너의 한투 키로 research/nxt_codex_audit_20261017/collect_extended.py를 실행하고
# 결과(gzip JSON)를 아티팩트로 받는다. 주문·배포·DB 쓰기 없음. 수동 실행 전용.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: investment-analysis-main
  cancel-in-progress: false

env:
  INSTANCE_ID: i-0dc146c28dca4089b

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::125022369601:role/github-actions-investing-deploy
          aws-region: ap-northeast-2
      - name: Run the collector on the production backend
        run: |
          set -euo pipefail
          ssm() {   # $1 = parameters json file, $2 = timeout seconds; prints stdout
            local id status
            id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
              --comment "kis nxt minute pull" --timeout-seconds 600 \
              --parameters "file://$1" --query Command.CommandId --output text)
            status=Pending
            for _ in $(seq 1 $(( $2 / 2 ))); do
              status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
                --query Status --output text 2>/dev/null || echo Pending)
              case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
              sleep 2
            done
            aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query StandardOutputContent --output text
            if [ "$status" != Success ]; then
              aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
                --query '[Status,StandardErrorContent]' --output text >&2
              return 1
            fi
          }
          bundle=$(tar czf - -C research/nxt_codex_audit_20261017 collect_extended.py extended_selection.json | base64 -w0)
          python3 - "$RUNNER_TEMP/run.json" "$bundle" <<'PY'
          import json, shlex, sys
          path, bundle = sys.argv[1:3]
          runner = ("import runpy,sys; sys.argv=['collect_extended.py', '/tmp/kis_codx_nxt_001']; "
                    "runpy.run_path('/tmp/kis_codx_nxt_001/collect_extended.py', run_name='__main__')")
          commands = [
              "set -eu",
              "mkdir -p /tmp/kis_codx_nxt_001",
              f"echo {bundle} | base64 -d | tar xzf - -C /tmp/kis_codx_nxt_001",
              "docker exec investment_backend mkdir -p /tmp/kis_codx_nxt_001",
              "docker cp /tmp/kis_codx_nxt_001/. investment_backend:/tmp/kis_codx_nxt_001/",
              "docker exec investment_backend python -c " + shlex.quote(runner),
              "docker cp investment_backend:/tmp/kis_codx_nxt_001/extended.json.gz /tmp/kis_codx_nxt_001/extended.json.gz",
              "base64 -w0 /tmp/kis_codx_nxt_001/extended.json.gz > /tmp/kis_codx_nxt_001/out.b64",
              "echo B64SIZE=$(wc -c < /tmp/kis_codx_nxt_001/out.b64)",
          ]
          json.dump({"commands": commands, "executionTimeout": ["3600"]}, open(path, "w"))
          PY
          ssm "$RUNNER_TEMP/run.json" 3900 | tee "$RUNNER_TEMP/run.out"
          size=$(grep -o 'B64SIZE=[0-9]*' "$RUNNER_TEMP/run.out" | cut -d= -f2)
          chunk=20000
          : > "$RUNNER_TEMP/out.b64"
          for i in $(seq 0 $(( (size - 1) / chunk ))); do
            printf '{"commands":["dd if=/tmp/kis_codx_nxt_001/out.b64 bs=%s skip=%s count=1 status=none"]}' "$chunk" "$i" > "$RUNNER_TEMP/c.json"
            ssm "$RUNNER_TEMP/c.json" 120 | tr -d '\n\r\t ' >> "$RUNNER_TEMP/out.b64"
          done
          mkdir -p out
          base64 -d "$RUNNER_TEMP/out.b64" > "out/kis_nxt_extended.json.gz"
          gzip -t "out/kis_nxt_extended.json.gz"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: kis-nxt-audited-extended
          path: out/
          retention-days: 7
